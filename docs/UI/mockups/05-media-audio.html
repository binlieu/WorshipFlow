<!doctype html><meta charset="utf-8"><title>WORSHIPFLOW — Media</title><link rel="stylesheet" href="ui.css"><script src="ui.js"></script>
<style>.body{display:grid;grid-template-columns:220px 1fr 340px;min-height:0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 12px;padding:14px}
.m{background-size:cover}.dur{position:absolute;right:5px;bottom:5px;font:600 10px/14px "SF Mono",ui-monospace,monospace;background:rgba(0,0,0,.6);padding:0 4px;border-radius:3px}
.kind{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.55);border-radius:4px;padding:2px;display:flex}
.scrub{height:6px;border-radius:3px;background:var(--surface-3);position:relative;flex:1}.scrub i{position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--cyan);border-radius:3px}.scrub u{position:absolute;left:38%;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;margin-left:-7px}
.mx{display:grid;grid-template-columns:110px repeat(4,1fr);font-size:11px;gap:4px;align-items:center}.mx span{text-align:center;color:var(--muted)}.mx i{height:22px;border-radius:5px;border:1px solid var(--border);display:block}.mx i.on{background:var(--cyan);border-color:var(--cyan)}
</style><body><div class="win" id="w"></div><script>
const G=['radial-gradient(120% 90% at 20% 10%,#1f6f8f,#0c2f55 45%,#05101f)','radial-gradient(110% 100% at 80% 90%,#2d7d6c,#123b52 50%,#050f1c)','linear-gradient(160deg,#3b2a5c,#0d1c3a 60%,#04101e)','linear-gradient(200deg,#7a4b1d,#3a1d24 55%,#0a0d1a)','radial-gradient(90% 90% at 50% 50%,#35506e,#0b1626)','linear-gradient(135deg,#0f4c5c,#062138)'];
const m=(n,k,d,g,cls='')=>`<div><div class="thumb m ${cls}" style="background:${G[g]}"><span class="kind">${I(k,'s')}</span>${d?`<span class="dur">${d}</span>`:''}</div><div class="cap"><b style="overflow:hidden;text-overflow:ellipsis">${n}</b></div></div>`;
w.innerHTML=toolbar('Media')+`<div class="body">
<div class="side"><div class="sec"><div class="h" style="margin-bottom:6px">Media bin</div><div class="li on">${I('film')}Motion backgrounds<span class="n">24</span></div><div class="li">${I('film')}Videos<span class="n">7</span></div><div class="li">${I('image')}Images<span class="n">41</span></div><div class="li">${I('mega')}Announcement loop<span class="n">9</span></div><div class="li">${I('cast')}Live inputs<span class="n">0</span></div></div>
 <div class="sec grow"><div class="h" style="margin-bottom:6px">Audio</div><div class="li">${I('music')}Walk-in music<span class="n">12</span></div><div class="li">${I('speaker')}Sound cues<span class="n">5</span></div></div>
 <div class="sec"><div class="row c-warn" style="font-size:12px;line-height:16px;align-items:flex-start">${I('warn')}<span><b>1 file is offline</b><br><span class="c-muted">Baptism testimony.mov — external disk not mounted.</span></span></div><span class="btn" style="margin-top:6px">Locate…</span></div></div>
<div class="main"><div class="bar"><span style="font-size:17px;font-weight:700;line-height:22px">Motion backgrounds</span><span class="grow"></span><span class="btn">${I('plus')}Import…</span><div class="seg"><b class="on">Background layer</b><b>Foreground</b></div><div class="seg"><b class="on">${I('grid','s')}</b><b>${I('list','s')}</b></div></div>
 <div class="grid">${m('Waves — teal','film','0:30',1,'live')}${m('Deep blue drift','film','0:20',0,'sel')}${m('Violet haze','film','0:45',2)}${m('Dawn light','film','1:00',3)}${m('Soft particles','film','0:30',4)}${m('Ocean slow','film','0:40',5)}${m('Sanctuary still','image','',4)}${m('Cross sunrise','image','',3)}${m('Welcome card','image','',5)}${m('Offering card','image','',2)}${m('Teal gradient','image','',1)}${m('Night sky','film','0:25',0)}${m('Candle bokeh','film','0:35',3)}${m('Mountains','image','',4)}${m('Baptism title','image','',5)}</div>
 <div class="grow"></div>
 <div style="border-top:1px solid var(--border);background:var(--surface);padding:10px 14px"><div class="row"><b>Waves — teal.mov</b><span class="badge fill" style="background:var(--live-fill);color:#fff">Live · background</span><span class="c-muted mono">1920×1080 · 59.94 · ProRes 422 · 0:30</span><span class="grow"></span><span class="pill c-ok">${I('loop','s')}Loop</span></div>
  <div class="row" style="margin-top:10px"><span class="btn">${I('prev','s')}</span><span class="btn">${I('play','s')}</span><span class="btn">${I('stop','s')}</span><span class="mono">00:11.4</span><div class="scrub"><i></i><u></u></div><span class="mono c-muted">−00:18.6</span><span class="btn">Mark in</span><span class="btn">Mark out</span><span class="btn">${I('bolt','s')}Add marker</span></div></div></div>
<div class="side r"><div class="sec"><div class="row" style="margin-bottom:8px"><span class="h">Audio cue</span><span class="grow"></span><span class="c-muted" style="font-size:11px">Walk-in music</span></div>
  <div class="row"><span class="btn">${I('play','s')}</span><div class="col grow"><b>Be Thou My Vision — instrumental</b><span class="c-muted mono">02:14 / 04:31</span></div></div>
  <div class="row" style="margin-top:10px"><div class="scrub"><i style="width:49%"></i><u style="left:49%"></u></div></div>
  <div class="row" style="margin-top:12px">${I('speaker')}<div class="scrub"><i style="width:70%;background:var(--blue)"></i><u style="left:70%"></u></div><span class="mono">−6 dB</span></div></div>
 <div class="sec"><div class="h" style="margin-bottom:8px">Routing</div><div class="mx"><b></b><span>Mixer L</span><span>Mixer R</span><span>SDI 3 emb.</span><span>SDI 1 emb.</span>
  <b>Media audio L</b><i class="on"></i><i></i><i></i><i></i><b>Media audio R</b><i></i><i class="on"></i><i></i><i></i><b>Audio cues L</b><i class="on"></i><i></i><i></i><i></i><b>Audio cues R</b><i></i><i class="on"></i><i></i><i></i></div>
  <div class="fr row" style="margin-top:10px"><label class="k" style="width:auto">Device</label><span class="field grow">QU-32 USB — 2 ch<span class="car">${I('down','s')}</span></span></div>
  <div class="c-muted" style="font-size:11px;line-height:15px;margin-top:8px">Send playback to the mixer once. Embedding the same audio on SDI as well would double it at the ATEM.</div></div>
 <div class="sec grow"><div class="h" style="margin-bottom:8px">Levels</div><div class="row" style="height:150px;align-items:stretch;gap:14px">
  ${[['L',62],['R',58],['Cue L',20],['Cue R',22]].map(a=>`<div class="col" style="align-items:center;gap:4px"><div class="meter" style="width:14px;flex:1"><i style="height:${a[1]}%"></i></div><span class="c-muted" style="font-size:10px">${a[0]}</span></div>`).join('')}
  <div class="col mono c-muted" style="justify-content:space-between;padding-bottom:18px"><span>0</span><span>−12</span><span>−24</span><span>−48</span></div></div></div></div></div>`+transport();
</script></body>
