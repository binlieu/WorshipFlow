<!doctype html><meta charset="utf-8"><title>WORSHIPFLOW — Screens</title><link rel="stylesheet" href="ui.css"><script src="ui.js"></script>
<style>.body{display:grid;grid-template-columns:300px 1fr;min-height:0}
.scr{padding:10px;border-radius:8px;display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}.scr.on{background:var(--surface-3)}
.map{display:grid;grid-template-columns:150px 28px 150px 28px 1fr 28px 150px 28px 170px;align-items:center;row-gap:8px;padding:14px;font-size:12px}
.node{border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;background:var(--surface-2);line-height:15px}.node small{display:block;color:var(--muted);font-size:11px}
.wire{height:2px;background:var(--border-strong)}.conn{border:1.5px solid currentColor;border-radius:8px;padding:6px 10px;background:var(--surface-2);display:flex;gap:8px;align-items:center}
.conn b{color:var(--text)}.conn small{color:var(--muted);font-size:11px;display:block}
.bnc{width:20px;height:20px;border-radius:50%;border:3px solid currentColor;flex:none;position:relative}.bnc:after{content:"";position:absolute;inset:4px;border-radius:50%;background:currentColor}
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;padding:14px}.fr{display:flex;align-items:center;gap:8px;min-height:32px}.fr .field{flex:1}
.stat{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 14px 14px}.stat div{background:var(--surface-2);border-radius:8px;padding:8px 10px}.stat b{display:block;font-size:17px;line-height:22px}.stat span{font-size:11px;color:var(--muted)}
</style><body><div class="win nobar" id="w"></div><script>
const scr=(cls,name,role,dest,c,th,on)=>`<div class="scr ${on?'on':''}">${th}<div><div class="row"><b>${name}</b><span class="grow"></span><span class="tgl on"></span></div><div class="row" style="margin-top:3px"><span class="badge ${c}">${role}</span></div><div class="c-muted" style="font-size:11px;margin-top:3px">${dest}</div></div></div>`;
const wire='<div class="wire"></div>';
w.innerHTML=toolbar('Screens')+`<div class="body">
<div class="side"><div class="sec row"><span class="h">Screens</span><span class="grow"></span><span class="btn" style="height:22px">${I('plus','s')}Add screen</span></div>
 <div class="sec grow" style="display:flex;flex-direction:column;gap:4px">
 ${scr('', 'Sanctuary','Audience','SDI 3 · 1080p59.94','c-aud',thumb('My chains are gone','Xiềng xích đã tan','bg2'))}
 ${scr('', 'Confidence','Stage','SDI 4 · 1080p59.94','c-stg','<div class="thumb" style="align-items:flex-start;padding:6%;text-align:left"><div class="l1" style="font-size:9cqw">My chains are gone</div></div>')}
 ${scr('', 'Livestream graphics','Broadcast','SDI 1 + 2 · Fill + Key','c-brd','<div class="thumb checker" style="justify-content:flex-end;padding-bottom:6%"><div style="background:rgba(7,19,33,.86);width:86%;border-radius:2cqw;padding:3cqw"><div class="l1" style="font-size:7cqw">My chains are gone</div></div></div>',1)}
 ${scr('', 'Lobby','Audience','Built-in HDMI · DELL S2725HS','c-aud',thumb('Welcome','Chào mừng','bg3'))}
 <div class="grow"></div>
 <div class="card" style="padding:10px;font-size:12px;line-height:16px"><div class="row" style="margin-bottom:4px">${I('warn')}<b>Verification</b></div><span class="c-muted">This path has only run against the simulated card. It becomes <b style="color:var(--text)">Hardware Verified</b> after a signal test on the real enclosure, card, converters and ATEM.</span><div class="row" style="margin-top:8px"><span class="btn">Run signal test…</span><span class="btn ghost">Export log bundle</span></div></div></div></div>
<div class="main" style="overflow:hidden">
 <div class="bar"><span style="font-size:17px;font-weight:700;line-height:22px">Signal map</span><span class="badge c-brd">Simulated</span><span class="grow"></span><span class="c-muted" style="font-size:12px">DeckLink channels come from Desktop Video, not from the display list.</span><span class="btn">${I('loop')}Rescan devices</span><span class="btn">Identify screens</span></div>
 <div class="map">
  <div class="node" style="grid-row:1/5">${I('cpu','l')}<b style="display:block;margin-top:4px">Mac mini M4</b><small>WORSHIPFLOW render engine</small><small class="mono" style="margin-top:4px">4 compositions · 0.64 ms</small></div>
  <div class="wire" style="grid-row:1/5"></div>
  <div class="node" style="grid-row:1/5">${I('cable','l')}<b style="display:block;margin-top:4px">Thunderbolt PCIe enclosure</b><small>carries PCIe, not video</small></div>
  <div class="wire" style="grid-row:1/5"></div>
  <div class="conn c-brd"><span class="bnc"></span><div><b>SDI 1 · Fill</b><small>Livestream graphics</small></div><span class="grow"></span>${I('layers')}</div>${wire}<div class="node">SDI → HDMI<small>active 3G converter</small></div>${wire}<div class="node"><b>ATEM input 5</b><small>key fill source</small></div>
  <div class="conn c-brd"><span class="bnc"></span><div><b>SDI 2 · Key</b><small>paired with SDI 1</small></div><span class="grow"></span>${I('key')}</div>${wire}<div class="node">SDI → HDMI<small>active 3G converter</small></div>${wire}<div class="node"><b>ATEM input 6</b><small>key source · linear</small></div>
  <div class="conn c-aud"><span class="bnc"></span><div><b>SDI 3 · Sanctuary</b><small>Audience</small></div><span class="grow"></span>${I('monitor')}</div>${wire}<div class="node">SDI → HDMI<small>active 3G converter</small></div>${wire}<div class="node"><b>Projector</b><small>sanctuary</small></div>
  <div class="conn c-stg"><span class="bnc"></span><div><b>SDI 4 · Confidence</b><small>Stage</small></div><span class="grow"></span>${I('stage')}</div>${wire}<div class="node">SDI → HDMI<small>active 3G converter</small></div>${wire}<div class="node"><b>Stage monitor</b><small>floor TV</small></div>
 </div>
 <div class="row" style="padding:0 14px 10px;gap:8px;font-size:12px"><span class="c-muted">DeckLink Duo 2 · four 3G-SDI connectors · HD only, no 4K.</span><span class="grow"></span><div class="seg"><b>4 independent outputs</b><b class="on">Fill + Key broadcast</b></div></div>
 <div style="border-top:1px solid var(--border)"></div>
 <div class="bar" style="border:0;padding-bottom:0"><b style="font-size:15px">Livestream graphics</b><span class="badge c-brd">Broadcast</span><span class="pill c-ok"><span class="d"></span>Running (simulated)</span><span class="grow"></span><span class="btn">Stop output</span><span class="btn ghost c-live">Remove screen</span></div>
 <div class="form"><div>
   <div class="fr"><label class="k">Name</label><span class="field">Livestream graphics</span></div>
   <div class="fr"><label class="k">Role</label><div class="seg"><b>Audience</b><b>Stage</b><b class="on">Broadcast</b></div></div>
   <div class="fr"><label class="k">Destination</label><span class="field">DeckLink Duo 2 — connectors 1 and 2<span class="car">${I('down','s')}</span></span></div>
   <div class="fr"><label class="k">Video mode</label><span class="field">1080p59.94<span class="car">${I('down','s')}</span></span><span class="field" style="flex:0 0 130px">10-bit YUV 4:2:2<span class="car">${I('down','s')}</span></span></div>
   <div class="fr"><label class="k">Colour</label><span class="field">Rec. 709 · video range<span class="car">${I('down','s')}</span></span></div>
   <div class="fr"><label class="k">Audio</label><span class="field">No embedded audio<span class="car">${I('down','s')}</span></span></div></div><div>
   <div class="fr"><label class="k">Fill and key</label><span class="tgl on"></span><span class="c-muted" style="font-size:12px">Uses two connectors and two ATEM inputs</span></div>
   <div class="fr"><label class="k">Fill alpha</label><div class="seg"><b class="on">Premultiplied</b><b>Straight</b></div></div>
   <div class="fr"><label class="k">Look</label><span class="field">Lower third only<span class="car">${I('down','s')}</span></span></div>
   <div class="fr"><label class="k">Layers</label><span class="chk"></span>Background<span class="chk on">${I('check','s')}</span>Slide<span class="chk on">${I('check','s')}</span>Props<span class="chk"></span>Notes</div>
   <div class="fr"><label class="k">If output fails</label><span class="field">Keep the show running, show a warning here<span class="car">${I('down','s')}</span></span></div>
   <div class="fr"><label class="k">Mirror</label><span class="btn">${I('plus','s')}Add mirror</span></div></div></div>
 <div class="stat"><div><b class="mono">59.94</b><span>frames per second</span></div><div><b class="mono">18 440</b><span>frames presented</span></div><div><b class="mono c-ok">0</b><span>dropped</span></div><div><b class="mono c-ok">0</b><span>late</span></div><div><b class="mono">2.1 ms</b><span>schedule lead · mean</span></div></div>
 <div style="display:grid;grid-template-columns:repeat(3,270px) 1fr;gap:14px;padding:0 14px">
  <div><div class="thumb checker" style="justify-content:flex-end;padding-bottom:5%"><div style="background:rgba(7,19,33,.86);width:86%;border-radius:1.5cqw;padding:2.2cqw"><div class="l1" style="font-size:4.6cqw">My chains are gone, I’ve been set free</div><div class="l2" style="margin-top:.6cqw;font-size:3.6cqw">Xiềng xích đã tan, tôi được tự do</div></div></div><div class="cap"><b>Composite</b>what the keyer produces</div></div>
  <div><div class="thumb" style="justify-content:flex-end;padding-bottom:5%"><div style="background:#071321;width:86%;border-radius:1.5cqw;padding:2.2cqw"><div class="l1" style="font-size:4.6cqw">My chains are gone, I’ve been set free</div><div class="l2" style="margin-top:.6cqw;font-size:3.6cqw">Xiềng xích đã tan, tôi được tự do</div></div></div><div class="cap"><span class="sq c-brd"></span><b>SDI 1 · Fill</b>premultiplied colour</div></div>
  <div><div class="thumb" style="justify-content:flex-end;padding-bottom:5%"><div style="background:#dbdbdb;width:86%;border-radius:1.5cqw;padding:2.2cqw"><div class="l1" style="font-size:4.6cqw;text-shadow:none">My chains are gone, I’ve been set free</div><div class="l2" style="margin-top:.6cqw;font-size:3.6cqw;color:#fff;text-shadow:none">Xiềng xích đã tan, tôi được tự do</div></div></div><div class="cap"><span class="sq c-brd"></span><b>SDI 2 · Key</b>matte: white opaque</div></div>
  <div class="c-muted" style="font-size:12px;line-height:17px"><b style="color:var(--text)">A black background is not transparency.</b><br>The fill carries colour, the key carries the matte. Set the ATEM keyer to linear key, premultiplied to match “Fill alpha”, and check key polarity with the calibration slide before the service.</div>
 </div>
</div></div>`;
</script></body>
