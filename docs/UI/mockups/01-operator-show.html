<!doctype html><meta charset="utf-8"><title>WORSHIPFLOW — Show</title><link rel="stylesheet" href="ui.css"><script src="ui.js"></script>
<style>.body{display:grid;grid-template-columns:256px 1fr 372px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0 10px}
.sl{font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;margin:0 0 5px}.grid+.sl{margin-top:9px}
.mon .thumb{border-radius:6px}.mh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dock{border-top:1px solid var(--border);background:var(--surface)}.mrow{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:10px 14px 6px}
.m{background-size:cover}.dur{position:absolute;right:4px;bottom:4px;font:600 9px/13px "SF Mono",ui-monospace,monospace;background:rgba(0,0,0,.6);padding:0 3px;border-radius:3px}
.scrub{height:5px;border-radius:3px;background:var(--surface-3);position:relative;flex:1}.scrub i{position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--cyan);border-radius:3px}.scrub u{position:absolute;left:38%;top:-4px;width:13px;height:13px;border-radius:50%;background:#fff;margin-left:-6px;box-shadow:0 0 0 1px var(--border-strong)}
.ctl{display:flex;align-items:center;gap:8px;padding:6px 14px 10px}.ib{height:24px;width:28px;padding:0;justify-content:center}
.lk{display:flex;gap:4px}.lk .btn{flex:1;justify-content:center;padding:0 4px;height:24px;font-size:11px}
.prow{display:flex;align-items:center;gap:8px;height:28px}
</style><body><div class="win" id="w"></div><script>
const ED=new URLSearchParams(location.search).get('edit')==='1';
const G=['radial-gradient(110% 100% at 80% 90%,#2d7d6c,#123b52 50%,#050f1c)','radial-gradient(120% 90% at 20% 10%,#1f6f8f,#0c2f55 45%,#05101f)','linear-gradient(160deg,#3b2a5c,#0d1c3a 60%,#04101e)','linear-gradient(200deg,#7a4b1d,#3a1d24 55%,#0a0d1a)','radial-gradient(90% 90% at 50% 50%,#35506e,#0b1626)','linear-gradient(135deg,#0f4c5c,#062138)','linear-gradient(20deg,#1d2a4a,#0a1020)'];

const cell=(n,a,b,cls,tag,cap)=>`<div>${thumb(a,b,cls,tag)}<div class="cap" style="margin-top:3px"><b>${n}</b>${cap}</div></div>`;

w.innerHTML=toolbar('Show')+`<div class="body">
<div class="side">

 <div class="sec grow"><div class="row" style="margin-bottom:6px"><span class="h">Playlist</span><span class="field" style="height:22px;margin-left:6px">Sunday 9:00 ${I('down','s')}</span><span class="grow"></span>${I('dots')}</div>

  <div class="li on">${I('music')}Amazing Grace<span class="n c-live" style="display:flex;align-items:center;gap:4px"><span class="dot"></span>LIVE</span></div><div class="li">${I('music')}Holy, Holy, Holy</div>

</div>
<div class="main">

  ${sec('chorus','Chorus','× 2')}<div class="grid">${cell(3,'Through many dangers<br>toils and snares','Qua bao hiểm nguy<br>Gian khó thử thách','bg2 live',LIVE,'Through many dangers…')}${cell(4,'’Tis grace has brought me<br>safe thus far','Ân điển đưa tôi<br>bình an đến nay','bg2 sel',PV,'’Tis grace has brought me…')}${cell(5,'The Lord has promised<br>good to me','Chúa đã hứa ban<br>phước lành cho tôi','bg2','','The Lord has promised…')}${cell(6,'And grace will lead<br>me home','Và ân điển sẽ<br>dẫn tôi về nhà','bg2','','And grace will lead…')}</div>
  ${sec('verse','Verse 2')}<div class="grid">${cell(7,'’Twas grace that taught my heart to fear<br>And grace my fears relieved','Chính ân điển dạy lòng tôi kính sợ<br>Và ân điển xua tan sợ hãi','bg1','','’Twas grace…')}${cell(8,'How precious did that grace appear<br>The hour I first believed','Ân điển ấy quý báu dường bao<br>Giờ tôi mới tin','bg1','','How precious…')}</div>
  ${sec('bridge','Ending')}<div class="grid">${cell(9,'','','bg3','','Blank · background only')}</div>
 </div>
 <div class="dock">
  <div class="tabs" style="align-items:center"><span class="h" style="margin-right:6px">Media bin</span><b class="on">${I('film','s')}Backgrounds</b><b>${I('film','s')}Videos</b><b>${I('image','s')}Images</b><b>${I('music','s')}Audio</b><span class="grow"></span>
   <div class="seg" style="margin:4px 0"><b class="on">Background layer</b><b>Foreground</b></div><span class="btn ghost" style="height:22px;padding:0 4px">${I('plus','s')}</span><span class="btn ghost" style="height:22px;padding:0 4px">${I('down','s')}</span></div>
  <div class="mrow">${med('Waves — teal','0:30',0,'live',LIVE)}${med('Deep blue drift','0:20',1,'sel')}${med('Violet haze','0:45',2)}${med('Dawn light','1:00',3)}${med('Soft particles','0:30',4)}${med('Ocean slow','0:40',5)}${med('Night sky','0:25',6)}</div>
  <div class="ctl"><span class="btn ib">${I('prev','s')}</span><span class="btn ib" style="background:var(--surface-3)">${I("pause","s")}</span><span class="btn ib">${I("stop",'s')}</span>
   <b style="white-space:nowrap;font-size:12px">Waves — teal.mov</b><span class="mono">00:11.4</span><div class="scrub"><i></i><u></u></div><span class="mono c-muted">−00:18.6</span>
   <span class="pill c-ok" style="height:22px">${I('loop','s')}Loop</span>${I('speaker')}<div class="scrub" style="flex:0 0 70px"><i style="width:60%;background:var(--blue)"></i><u style="left:60%"></u></div><span class="pill c-aud" style="height:18px">AUD</span></div>
 </div>
</div>
<div class="side r">
 <div class="sec mon" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
  <div><div class="mh"><span class="badge c-aud">Preview</span><span class="c-muted" style="font-size:11px">slide 4</span></div>${thumb('’Tis grace has brought me<br>safe thus far','Ân điển đưa tôi<br>bình an đến nay','bg2 sel')}</div>
  <div><div class="mh"><span class="badge fill" style="background:var(--live-fill);color:#fff">Live</span><span class="c-muted" style="font-size:11px">Audience · SDI 3</span></div>${thumb('Through many dangers<br>toils and snares','Qua bao hiểm nguy<br>Gian khó thử thách','bg2 live')}</div>
  <div><div class="thumb" style="align-items:flex-start;text-align:left;padding:6%"><div class="l1" style="font-size:8cqw">Through many dangers<br>toils and snares</div><div class="l1" style="font-size:5.5cqw;color:#9fb2c7;margin-top:4cqw">NEXT · ’Tis grace has brought me</div><div style="position:absolute;right:6%;top:6%;font-size:6cqw;font-weight:700;color:#ffd17b">10:32</div></div>
   <div class="cap"><span class="dot c-stg"></span><b>Stage</b>SDI 4</div></div>
  <div><div class="thumb checker" style="justify-content:flex-end;padding-bottom:5%"><div style="background:rgba(7,19,33,.86);width:88%;border-radius:1.5cqw;padding:2.5cqw"><div class="l1" style="font-size:5.4cqw">Through many dangers, toils and snares</div><div class="l2" style="margin-top:1cqw;font-size:4.2cqw">Qua bao hiểm nguy, gian khó thử thách</div></div></div>

 <div class="sec" style="padding-top:8px;padding-bottom:8px"><div class="row"><span class="h" style="width:36px">Look</span><div class="lk grow"><span class="btn" style="background:var(--surface-3);box-shadow:0 0 0 1.5px var(--sel)">Full</span><span class="btn">Notes</span><span class="btn">Lower 3rd</span><span class="btn">BG only</span></div><span class="btn ghost" style="height:24px;padding:0 2px">${I('down','s')}</span></div></div>

</script></body>
