<!doctype html><meta charset="utf-8"><title>WORSHIPFLOW — Show</title><link rel="stylesheet" href="ui.css"><script src="ui.js"></script>
<style>.body{display:grid;grid-template-columns:256px 1fr 372px;min-height:0}

  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div class="field" style="height:44px;align-items:flex-start;padding-top:5px">My God, my Savior<br>has ransomed me</div><div class="field" style="height:44px;align-items:flex-start;padding-top:5px">Chúa tôi, Cứu Chúa tôi<br>đã chuộc tôi</div><div class="field ph" style="height:44px;align-items:flex-start;padding-top:5px">Speaker notes — stage screens only</div></div></div>

   <div class="cap"><span class="dot c-brd"></span><b>Broadcast</b>SDI 1+2 · Fill + Key</div></div></div>
  <div class="row mono c-muted" style="margin-top:8px"><span class="badge c-brd" style="font-family:Inter">Simulated</span>Not Hardware Verified</div></div>
 <div class="sec"><div class="h" style="margin-bottom:8px">Look</div><div class="look"><span class="btn" style="box-shadow:0 0 0 2px var(--sel)">Worship — full</span><span class="btn">Sermon — notes</span><span class="btn">Lower third only</span><span class="btn">Background only</span></div></div>

  <div class="row" style="height:26px">${I('image')}Church logo bug<span class="grow"></span><span class="pill c-aud" style="height:16px">AUD</span><span class="pill c-brd" style="height:16px">BRD</span><span class="tgl on"></span></div>
  <div class="row" style="height:26px">${I('text')}Service title strap<span class="grow"></span><span class="pill c-brd" style="height:16px">BRD</span><span class="tgl"></span></div>
  <div class="row" style="height:26px">${I('msg')}Stage message<span class="grow"></span><span class="field ph" style="width:150px;height:22px">Wrap up in 2 min…</span></div></div>
